[SERVICE]
    Flush           5
    Log_Level       info
    Parsers_File    parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.*
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Keep_Log            Off

# Configure an output compatible with your Fluent Bit version and Loki plugin.
# The exact Loki output plugin/options vary by version; validate before use.
# This file is not deployable until an output and parsers are configured.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Add targets only after confirming the service exposes a Prometheus metrics endpoint.
# Do not assume every Robot Shop service exposes /metrics.
